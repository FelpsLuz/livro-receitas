name: Build CRM Juridico (instaladores)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
    paths:
      - 'crm-juridico/**'

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crm-juridico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: crm-juridico-${{ matrix.os }}
          path: |
            crm-juridico/dist/*.exe
            crm-juridico/dist/*.AppImage
            crm-juridico/dist/*.dmg
