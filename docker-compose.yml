# Ambiente local para testar o site antes da virada.
#
#   docker compose up -d
#   docker compose run --rm wpcli wp core install \
#     --url=http://localhost:8080 --title="Felipe Luz Broker" \
#     --admin_user=felipe --admin_password=trocar123 --admin_email=voce@exemplo.com
#   docker compose run --rm wpcli wp theme install generatepress
#   docker compose run --rm wpcli wp plugin install meta-box --activate
#   docker compose run --rm wpcli wp theme activate felipeluz
#   docker compose run --rm wpcli wp plugin activate fl-imoveis
#   docker compose run --rm wpcli wp fl instalar-paginas
#
# Depois: http://localhost:8080
#
# Para importar a carteira, deixe o XML na raiz do projeto (ele é montado
# em /var/www/html/xml dentro dos contêineres):
#   docker compose run --rm wpcli wp fl inspecionar-xml --file=/var/www/html/xml/carteira.xml

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp:/var/www/html
      # Só o nosso código é montado do repositório. O core do WordPress
      # e os plugins de terceiros vivem no volume, fora do git.
      - ./wp-content/plugins/fl-imoveis:/var/www/html/wp-content/plugins/fl-imoveis
      - ./wp-content/themes/felipeluz:/var/www/html/wp-content/themes/felipeluz
      - ./:/var/www/html/xml:ro

  wpcli:
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ./wp-content/plugins/fl-imoveis:/var/www/html/wp-content/plugins/fl-imoveis
      - ./wp-content/themes/felipeluz:/var/www/html/wp-content/themes/felipeluz
      - ./:/var/www/html/xml:ro

volumes:
  db:
  wp:
